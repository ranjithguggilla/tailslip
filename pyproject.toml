[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tailslip"
version = "0.1.0"
description = "Departure delay forecasts that follow each aircraft down its chain of flights"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ranjith Guggilla", email = "ranjithguggilla668@gmail.com" }]
dependencies = [
  "numpy>=2.0",
  "pandas>=3.0",
  "scikit-learn>=1.5",
  "quantile-forest>=1.4",
  "sortedcontainers>=2.4",
  "plotnine>=0.14",
  "matplotlib>=3.9",
  "pyarrow>=16",
  "joblib>=1.4",
  "gradio>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
tailslip = "tailslip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "B023", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
